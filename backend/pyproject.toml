[project]
name = "interreview-backend"
version = "0.1.0"
description = "InterReview API — FastAPI backend (STT proxy, question generation, measurements)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "sherpa-onnx==1.13.7",
    "sherpa-onnx-bin==1.13.7",
    "anthropic>=1.0.0",
    "google-genai>=1.0.0",
    "supertonic==1.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # test_llm.py builds httpx2 responses to construct SDK errors; declare it
    # instead of leaning on it being anthropic's transitive dependency.
    "httpx2>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
